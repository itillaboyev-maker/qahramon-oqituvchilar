name = "qahramon-oqituvchilar"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   DATABASE_URL           - Supabase Postgres connection string (pooled, port 6543)
#   PUBLIC_BOT_TOKEN       - Telegram token for the public-facing bot
#   ADMIN_BOT_TOKEN        - Telegram token for the moderator/admin bot
#   PUBLIC_BOT_WEBHOOK_SECRET
#   ADMIN_BOT_WEBHOOK_SECRET
#   REQUIRED_CHANNEL_ID    - e.g. "@qahramon_oqituvchilar"
#   SUPPORT_BOT_TOKEN       - Telegram token for the support-forwarder bot
#   SUPPORT_BOT_WEBHOOK_SECRET
#   SUPPORT_ADMIN_CHAT_ID   - your personal Telegram numeric user ID

[vars]
ENVIRONMENT = "production"
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "qahramon-ustozlar-media"
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true